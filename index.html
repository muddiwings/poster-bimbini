<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Animato</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .poster {
      max-width: 100vw;
      max-height: 100vh;
    }

    .poster svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100vh;
    }

    /* ===== ANIMAZIONI ===== */

    @keyframes dondola {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-3deg); }
      75% { transform: rotate(3deg); }
    }

    .anim-dondola {
      animation: dondola 2s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    @keyframes fluttua {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .anim-fluttua {
      animation: fluttua 2.5s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    @keyframes ruota {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }

    .anim-ruota {
      animation: ruota 3s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    @keyframes rimpicciolisci {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.92); }
    }

    .anim-rimpicciolisci {
      animation: rimpicciolisci 2s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    @keyframes oscilla {
      0%, 100% { transform: translateX(0px) rotate(0deg); }
      25% { transform: translateX(-6px) rotate(-2deg); }
      75% { transform: translateX(6px) rotate(2deg); }
    }

    .anim-oscilla {
      animation: oscilla 3s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    /* ===== PRESSA ===== */

    @keyframes pressa-fullscreen {
      0% {
        transform: translate(-324px, -3900px) scale(4.5);
      }
      30% {
        transform: translate(-324px, -1680px) scale(4.5);
      }
      40% {
        transform: translate(-324px, -1680px) scale(4.5);
      }
      100% {
        transform: translate(-324px, -3900px) scale(4.5);
      }
    }

    .anim-pressa-fullscreen {
      animation: pressa-fullscreen 6s ease-in-out 1 forwards;
      transform-origin: 864px 450px;
      transform-box: view-box;
    }

  </style>
</head>

  <script>
    // Lista di tutti i gruppi personaggio
    const GRUPPI = ['viola', 'verde', 'blu', 'arancione', 'rosso', 'giallo'];

    // Sfasamento predefinito tra personaggi (secondi)
    const SFASAMENTO = 0.3;

    // Trova un gruppo per ID all'interno dell'SVG
    function trovaGruppo(nome) {
      return document.querySelector(`#strisce #${nome}`);
    }

    // Applica un'animazione a tutti i personaggi con sfasamento
    // escludi: array opzionale di gruppi da saltare (es. ['giallo'])
    function applicaAnimazione(nomeGruppo, nomeAnimazione, sfasamento, escludi = []) {
      const attivi = GRUPPI.filter(g => !escludi.includes(g));
      const idx = attivi.indexOf(nomeGruppo);
      if (idx === -1) {
        console.warn(`Gruppo "${nomeGruppo}" non trovato tra gli attivi.`);
        return;
      }

      // Rimuovi animazioni precedenti da tutti
      GRUPPI.forEach(g => {
        const el = trovaGruppo(g);
        if (el) {
          el.classList.remove(`anim-${nomeAnimazione}`);
          el.style.animationDelay = '';
        }
      });

      attivi.forEach((nome, i) => {
        const gruppo = trovaGruppo(nome);
        if (!gruppo) return;

        let delay = (i - idx) * sfasamento;
        if (delay < 0) delay += attivi.length * sfasamento;

        gruppo.classList.add(`anim-${nomeAnimazione}`);
        gruppo.style.animationDelay = `${delay}s`;
      });
    }

    // Aggiunge una nuova animazione al sistema
    function aggiungiAnimazione(nome, keyframesCSS) {
      const style = document.createElement('style');
      style.textContent = `
        @keyframes ${nome} {
          ${keyframesCSS}
        }
        .anim-${nome} {
          animation: ${nome} 2s ease-in-out infinite;
        }
      `;
      document.head.appendChild(style);
    }

    // === AVVIO ===
    document.addEventListener('DOMContentLoaded', () => {
      const pressa = document.querySelector('#strisce #pressa');
      if (pressa) {
        pressa.classList.add('anim-pressa-fullscreen');
        pressa.addEventListener('animationend', () => {
          document.querySelectorAll('.schiacciato').forEach(el => {
            el.classList.remove('schiacciato');
          });
          avviaFisicaSchiacciati();
        }, { once: true });
      }

      setTimeout(() => {
        GRUPPI.forEach(nome => {
          const el = trovaGruppo(nome);
          if (el) {
            el.style.display = 'none';
          }
        });
        const scritta = trovaGruppo('scritta');
        if (scritta) {
          scritta.style.display = 'none';
        }
      }, 2000);
    });

    function avviaFisicaSchiacciati() {
      const Engine = Matter.Engine;
      const Bodies = Matter.Bodies;
      const Body = Matter.Body;
      const Composite = Matter.Composite;
      const Events = Matter.Events;
      const Runner = Matter.Runner;

      const engine = Engine.create({
        gravity: { x: 0, y: 2.5 }
      });

      // Pavimento e pareti
      const ground = Bodies.rectangle(540, 1840, 1080, 80, { isStatic: true });
      const leftWall = Bodies.rectangle(-10, 960, 20, 1920, { isStatic: true });
      const rightWall = Bodies.rectangle(1090, 960, 20, 1920, { isStatic: true });
      Composite.add(engine.world, [ground, leftWall, rightWall]);

      const schiacciati = [
        { id: 'viola_schiacciato',  x: 454, y: 250, w: 170, h: 120 },
        { id: 'verde_schiacciato',  x: 736, y: 250, w: 170, h: 120 },
        { id: 'blu_schiacciato',    x: 454, y: 524, w: 170, h: 120 },
        { id: 'arancione_schiacciato', x: 736, y: 524, w: 170, h: 120 },
        { id: 'rosso_schiacciato',  x: 454, y: 769, w: 170, h: 120 },
        { id: 'giallo_schiacciato', x: 736, y: 769, w: 170, h: 120 },
      ];

      const bodies = schiacciati.map(s => {
        const xOff = (Math.random() - 0.5) * 30;
        const body = Bodies.rectangle(s.x + xOff, s.y - 20, s.w, s.h, {
          restitution: 0.25 + Math.random() * 0.15,
          friction: 0.8 + Math.random() * 0.2,
          frictionAir: 0.012 + Math.random() * 0.008,
          density: 0.002,
          angle: (Math.random() - 0.5) * 0.5
        });
        body._svgId = s.id;
        body._initX = s.x;
        body._initY = s.y;
        Composite.add(engine.world, body);
        return body;
      });

      Events.on(engine, 'afterUpdate', () => {
        bodies.forEach(body => {
          const el = document.getElementById(body._svgId);
          if (el) {
            const dx = body.position.x - body._initX;
            const dy = body.position.y - body._initY;
            el.setAttribute('transform',
              `translate(${dx.toFixed(1)}, ${dy.toFixed(1)}) rotate(${body.angle.toFixed(1)}, ${body._initX}, ${body._initY})`
            );
          }
        });
      });

      const runner = Runner.create();
      Runner.run(runner, engine);
    }

  </script>
